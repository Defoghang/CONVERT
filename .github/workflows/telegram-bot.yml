name: Run Telegram Bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev zlib1g-dev yasm pkg-config libgmp-dev libpcap-dev libbz2-dev git \
            hashcat pdfcrack poppler-utils unrar-free p7zip-full cabextract \
            steghide binwalk foremost testdisk sleuthkit file binutils \
            qpdf hydra libidn11-dev libssh-dev libpg-dev libgcrypt20-dev freerdp2-dev

      - name: Install stegseek
        run: |
          wget -q https://github.com/RickdeJager/stegseek/releases/download/v0.6/stegseek_0.6-1.deb -O /tmp/stegseek.deb
          sudo apt-get install -y /tmp/stegseek.deb || sudo dpkg -i /tmp/stegseek.deb || true

      - name: Build and install John the Ripper Jumbo
        run: |
          git clone --depth 1 https://github.com/openwall/john.git -b bleeding-jumbo $HOME/john-src
          cd $HOME/john-src/src
          ./configure
          make -s clean
          make -sj$(nproc)
          sudo mkdir -p /opt/john/run
          sudo cp -r ../run/* /opt/john/run/
          echo "/opt/john/run" >> $GITHUB_PATH

      - name: Install rockyou wordlist
        run: |
          sudo mkdir -p /usr/share/wordlists
          sudo wget -q https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt -O /usr/share/wordlists/rockyou.txt
          ls -la /usr/share/wordlists/
          hydra -h | head -3 || true

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install ciphey theHarvester || true

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          DATABASE_PATH: ${{ github.workspace }}/bot_data.db
          LOG_LEVEL: INFO
        run: python bot.py
