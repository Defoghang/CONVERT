name: Run Telegram Bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip

      - name: Install rockyou wordlist
        run: |
          sudo mkdir -p /usr/share/wordlists
          sudo wget -q https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt -O /usr/share/wordlists/rockyou.txt || true
          ls -la /usr/share/wordlists/ || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify semgrep
        run: |
          semgrep --version

      - name: Verify bandit
        run: |
          bandit --version

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          DATABASE_PATH: ${{ github.workspace }}/bot_data.db
          LOG_LEVEL: INFO
        run: python bot.py
