name: Run Telegram Bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip tar gzip bzip2 xz-utils p7zip-full unrar-free pipx

      - name: Install Semgrep
        run: |
          pipx install semgrep==1.99.0
          pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Bandit and pytest
        run: |
          pip install bandit==1.7.10 pytest==8.3.4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tools
        run: |
          semgrep --version
          bandit --version
          python3 -m pytest --version

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_PATH: ${{ github.workspace }}/bot_data.db
          LOG_LEVEL: INFO
        run: python bot.py
